<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="landing">
    <nav>
      <div class="row nav__container">
        <div class="nav__logo">
          <img class="nav__logo--img" src="./assets/logo.2c489fc453a1783cbadacf914efa3df6.svg">
          <div class="nav__logo--title">Treact</div>
        </div>
        <ul class="nav__links">
          <li><a href="#" class="nav__link">About</a></li>
          <li><a href="#" class="nav__link">Blog</a></li>
          <li><a href="#" class="nav__link">Pricing</a></li>
          <li><a href="#" class="nav__link">Contact Us</a></li>
          <li><a href="#" class="nav__link login">Login</a></li>
          <li><a href="#" class="nav__link navlink--primary">Sign Up</a></li>
        </ul>
        <button class="btn__menu" onclick="openMenu()"></button>
        </div>
      </div>
    </nav>
    <div class="menu">
      <button class="btn__menu btn__menu--close" on lick="closeMenu"></button>
      <div class="menu__links">
        <a href="#about" class="menu__link" onclick="closeMenu()">About</a>
        <a href="#blog" class="menu__link" onclick="closeMenu()">Blog</a>
        <a href="#pricing" class="menu__link" onclick="closeMenu()">Pricing</a>
        <a href="#contact__us" class="menu__link" onclick="closeMenu()">Contact Us</a>
        <a href="#login" class="menu__link" onclick="closeMenu()">Login</a>
        <a href="#signup" class="menu__link menu__link--primary" onclick="closeMenu()">Sign up</a>
      </div>
    </div>
    <header>
      <div class="container">
        <div class="row">
          <div class="header__description">
            <h1>Beautiful React Templates <span="purple">for you.</span></h1>
            <p class="header__description--para">A collection of beautifully designed React templates to help you build amazing web applications.</p>
            <div class="header__email--input">
              <input type="email" placeholder="Enter your email address">
              <button class="header__email--btn">Get Started</button>
            </div>
            <p class="header__customers--title">OUR TRUSTED CUSTOMERS</p>
            <img src="./assets/customers-logo-strip.680ac7c2e8ae28161d2c.png" alt="Customers Logo" class="header__customers">
          </div>
          <figure class="header__img--wrapper">
            <img src="./assets/design-illustration-2.6da6a00b20c07c4a9b65d1870679e1b8.svg" alt="" class="header__img">
          </figure>
        </div>
      </div>
    </header>
  </section>
</body>
</html>
